name = "jsp-000465-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Jsp000465Lean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Jsp000465Lean"
