statement:
  text: |
    Compactness.theorem_1_1 :
      CompactnessFamilyProps ∧
        ((fun n => (ex n F : ℝ)) =O[atTop] (fun n => (n : ℝ) ^ (4/3 - compactnessEps))) ∧
        (∀ i : FIndex,
          (fun n => (extremalNumber n (F i) : ℝ)) =Ω[atTop]
            (fun n => (n : ℝ) ^ (4/3)))
    Informal: there exists a finite family F of connected bipartite graphs, each containing a cycle,
    such that ex(n,F)=O(n^{4/3-1/48}) while every member F satisfies ex(n,F)=Ω(n^{4/3}).
